<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#ec4899;#06b6d4" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#06b6d4;#8b5cf6;#ec4899" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="50" cy="50" r="45" fill="#0a0a1e">
    <animate attributeName="r" values="43;47;43" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.6" stroke-dasharray="8 4" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="8s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="50" r="35" fill="#000000"/>
  
  <text x="50" y="60" font-family="Arial" font-size="28" font-weight="900" fill="url(#g1)" text-anchor="middle" filter="url(#glow)">MS</text>
  
  <circle cx="50" cy="15" r="2" fill="#06b6d4">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="85" cy="50" r="2" fill="#8b5cf6">
    <animateTransform attributeName="transform" type="rotate" from="90 50 50" to="450 50 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="85" r="2" fill="#ec4899">
    <animateTransform attributeName="transform" type="rotate" from="180 50 50" to="540 50 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="15" cy="50" r="2" fill="#06b6d4">
    <animateTransform attributeName="transform" type="rotate" from="270 50 50" to="630 50 50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="50" r="2" fill="#ffffff">
    <animate attributeName="r" values="1.5;3;1.5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
