<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background with Grid -->
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    
    <!-- Glowing Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 3D Shadow -->
    <filter id="shadow3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Grid Background -->
  <rect width="512" height="512" fill="url(#grid)"/>
  
  <!-- Outer Rotating Ring -->
  <g transform="translate(256, 256)">
    <!-- Ring 1 -->
    <circle r="180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" stroke-dasharray="10 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Ring 2 -->
    <circle r="160" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="15s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Ring 3 -->
    <circle r="140" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.3" stroke-dasharray="8 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Main Container - 3D Cube Effect -->
  <g transform="translate(256, 256)" filter="url(#shadow3d)">
    <!-- Top Face -->
    <path d="M -80 -100 L 0 -140 L 80 -100 L 0 -60 Z" fill="#1a1a2e" stroke="#06b6d4" stroke-width="2"/>
    
    <!-- Left Face -->
    <path d="M -80 -100 L -80 100 L 0 140 L 0 -60 Z" fill="#0f0f1e" stroke="#8b5cf6" stroke-width="2"/>
    
    <!-- Right Face -->
    <path d="M 80 -100 L 80 100 L 0 140 L 0 -60 Z" fill="#15152e" stroke="#ec4899" stroke-width="2"/>
  </g>
  
  
  <!-- MS Text - 3D Effect -->
  <g transform="translate(256, 256)">
    <!-- Shadow layers -->
    <text x="0" y="10" font-family="Arial" font-size="100" font-weight="900" fill="#06b6d4" text-anchor="middle" opacity="0.3">MS</text>
    <text x="-2" y="8" font-family="Arial" font-size="100" font-weight="900" fill="#8b5cf6" text-anchor="middle" opacity="0.5">MS</text>
    <text x="-4" y="6" font-family="Arial" font-size="100" font-weight="900" fill="#ec4899" text-anchor="middle" opacity="0.7">MS</text>
    
    <!-- Main Text -->
    <text x="-6" y="4" font-family="Arial" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">MS</text>
  </g>
  
  <!-- Animated Particles -->
  <circle cx="100" cy="100" r="3" fill="#06b6d4">
    <animate attributeName="cy" values="100;400;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="412" cy="150" r="3" fill="#8b5cf6">
    <animate attributeName="cy" values="150;450;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="412" r="3" fill="#ec4899">
    <animate attributeName="cx" values="150;400;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Bottom Text -->
  <text x="256" y="380" font-family="monospace" font-size="16" font-weight="600" fill="#06b6d4" text-anchor="middle" letter-spacing="3">DEVELOPER</text>
  
  <!-- Corner Tech Elements -->
  <g opacity="0.6">
    <circle cx="50" cy="50" r="4" fill="#06b6d4"/>
    <circle cx="462" cy="50" r="4" fill="#8b5cf6"/>
    <circle cx="50" cy="462" r="4" fill="#ec4899"/>
    <circle cx="462" cy="462" r="4" fill="#06b6d4"/>
    
    <line x1="50" y1="50" x2="80" y2="50" stroke="#06b6d4" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="80" stroke="#06b6d4" stroke-width="2"/>
    
    <line x1="462" y1="50" x2="432" y2="50" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="462" y1="50" x2="462" y2="80" stroke="#8b5cf6" stroke-width="2"/>
    
    <line x1="50" y1="462" x2="80" y2="462" stroke="#ec4899" stroke-width="2"/>
    <line x1="50" y1="462" x2="50" y2="432" stroke="#ec4899" stroke-width="2"/>
    
    <line x1="462" y1="462" x2="432" y2="462" stroke="#06b6d4" stroke-width="2"/>
    <line x1="462" y1="462" x2="462" y2="432" stroke="#06b6d4" stroke-width="2"/>
  </g>
</svg>
